<!DOCTYPE html>
<html lang="en">
<!--
  RACCOON AI — public chat page.
  Loads a trained GRU from docs/model.json (or IndexedDB) and generates
  replies in the style of your documents.

  Train a model first with train.html.
-->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raccoon AI</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<style>
  :root{
    --bg:#0b0e13; --panel:#151a22; --border:#232b36;
    --text:#e6edf3; --muted:#8b98a9; --accent:#5b8cff; --good:#7ee2a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, #1b2433, #0b0e13 60%);
    color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100dvh; max-width:820px; margin:0 auto; display:flex; flex-direction:column}

  header{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .logo{
    width:28px; height:28px; border-radius:9px;
    background:linear-gradient(135deg,#3b6bff,#8a5bff);
    display:grid; place-items:center; font-size:15px; flex:0 0 auto;
  }
  h1{font-size:15px; margin:0; font-weight:600}
  .pill{
    font-size:11px; padding:3px 9px; border-radius:999px;
    border:1px solid var(--border); color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px;
  }
  .pill.ok{color:var(--good); border-color:#2c5a41; background:#12251b}
  .pill.bad{color:#ffb3b3; border-color:#6b2b2b; background:#1e1214}
  .spacer{flex:1}
  .header-link{
    color:var(--accent); text-decoration:none; font-size:12px;
    padding:5px 10px; border-radius:7px; border:1px solid var(--border);
  }
  .header-link:hover{color:var(--text); border-color:#39465a}

  #chat{
    flex:1; overflow-y:auto; padding:18px 16px 8px;
    display:flex; flex-direction:column; gap:12px;
  }
  #chat::-webkit-scrollbar{width:8px}
  #chat::-webkit-scrollbar-thumb{background:#222b38; border-radius:4px}

  .row{display:flex; gap:10px; align-items:flex-start; animation:pop .2s ease}
  .row.user{flex-direction:row-reverse}
  @keyframes pop{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  .avatar{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    display:grid; place-items:center; font-size:10px; font-weight:700;
    background:#20293a; color:#9fb3d1;
  }
  .row.user .avatar{background:linear-gradient(135deg,#3b6bff,#6a5bff); color:#fff}

  .bubble{
    max-width:80%; padding:10px 14px; border-radius:14px;
    background:var(--panel); border:1px solid var(--border);
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13.5px;
    line-height:1.6;
  }
  .row.user .bubble{
    background:linear-gradient(135deg,#3b6bff,#6a5bff);
    border-color:transparent; color:#fff;
    border-bottom-right-radius:4px;
    font-family:inherit; font-size:15px;
  }
  .row.assistant .bubble{border-bottom-left-radius:4px}
  .bubble.streaming::after{
    content:"▍"; margin-left:2px; color:var(--accent);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .banner{
    margin:0 16px 8px; padding:10px 14px; border-radius:9px;
    background:#1e1a12; border:1px solid #4a3d1a; color:#ffe1a0;
    font-size:12.5px; line-height:1.55;
  }
  .banner.ok{background:#12251b; border-color:#2c5a41; color:#9cebbd}
  .banner.bad{background:#1e1214; border-color:#6b2b2b; color:#ffb3b3}
  .banner code{background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; font-size:11px}

  footer{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    display:flex; gap:10px; align-items:flex-end;
  }
  #input{
    flex:1; resize:none; max-height:160px; padding:11px 14px; border-radius:14px;
    border:1px solid var(--border); background:#10151d; color:var(--text);
    font:15px/1.45 inherit; outline:none; transition:border-color .15s;
  }
  #input:focus{border-color:#3b6bff}
  #input::placeholder{color:#5c6a7d}
  #input:disabled{opacity:.5}
  #send{
    flex:0 0 auto; height:44px; width:44px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#3b6bff,#6a5bff); color:#fff; font-size:17px;
    display:grid; place-items:center; transition:transform .12s, opacity .15s;
  }
  #send:hover:not(:disabled){transform:translateY(-1px)}
  #send:disabled{opacity:.4; cursor:not-allowed}

  .hidden{display:none !important}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">🦝</div>
    <h1>Raccoon AI</h1>
    <span class="pill" id="status">Loading…</span>
    <div class="spacer"></div>
    <a class="header-link" href="train.html">Train model</a>
  </header>

  <div class="banner" id="banner">
    Loading a trained neural network…
  </div>

  <main id="chat"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Type something…" disabled></textarea>
    <button id="send" disabled>➤</button>
  </footer>
</div>

<script>
/* =========================================================
   Shared constants — must match train.html
   ========================================================= */
const SEQ_LEN = 30;
const EMBED_DIM = 24;
const GRU_UNITS = 96;

const MODEL_URL = 'docs/model.json';
const MODEL_FORMAT = 'raccoon-gru-v1';
const IDB_KEY = 'indexeddb://raccoon-brain-gru';

/* =========================================================
   DOM
   ========================================================= */
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const bannerEl = document.getElementById('banner');

/* =========================================================
   State
   ========================================================= */
let model = null;
let charToIdx = new Map();
let idxToChar = [];
let vocabSize = 0;
let ready = false;
let busy = false;
let greetingShown = false;

/* =========================================================
   UI
   ========================================================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function scrollDown(){ chatEl.scrollTop = chatEl.scrollHeight; }

function autoGrow(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}

function addBubble(role, text = ''){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? 'YOU' : 'R';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.append(av, bubble);
  chatEl.append(row);
  scrollDown();
  return bubble;
}

function setStatus(text, kind){
  statusEl.textContent = text;
  statusEl.classList.remove('ok','bad');
  if (kind === 'ok') statusEl.classList.add('ok');
  if (kind === 'bad') statusEl.classList.add('bad');
}

function setBanner(html, kind){
  bannerEl.innerHTML = html;
  bannerEl.classList.remove('ok','bad');
  if (kind === 'ok') bannerEl.classList.add('ok');
  if (kind === 'bad') bannerEl.classList.add('bad');
}

/* =========================================================
   Model architecture (must match train.html)
   ========================================================= */
function buildModel(vSize){
  const m = tf.sequential();
  m.add(tf.layers.embedding({
    inputDim: vSize,
    outputDim: EMBED_DIM,
    inputLength: SEQ_LEN
  }));
  m.add(tf.layers.gru({ units: GRU_UNITS }));
  m.add(tf.layers.dense({ units: vSize, activation: 'softmax' }));
  return m;
}

/* =========================================================
   Load model from docs/model.json
   ========================================================= */
async function loadModelFromJSON(json){
  if (json.format !== MODEL_FORMAT)
    throw new Error('Unsupported model format: ' + json.format);
  if (json.seqLen !== SEQ_LEN)
    throw new Error(`Model SEQ_LEN is ${json.seqLen}, expected ${SEQ_LEN}.`);
  if (json.embedDim !== EMBED_DIM)
    throw new Error(`Model EMBED_DIM is ${json.embedDim}, expected ${EMBED_DIM}.`);
  if (json.gruUnits !== GRU_UNITS)
    throw new Error(`Model GRU_UNITS is ${json.gruUnits}, expected ${GRU_UNITS}.`);

  idxToChar = json.vocab;
  vocabSize = idxToChar.length;
  charToIdx = new Map();
  idxToChar.forEach((ch, i) => charToIdx.set(ch, i));

  const m = buildModel(vocabSize);
  const tensors = json.weights.map(w => tf.tensor(w.data, w.shape));
  m.setWeights(tensors);
  tensors.forEach(t => t.dispose());
  return m;
}

/* =========================================================
   Load model from IndexedDB
   ========================================================= */
async function loadModelFromIndexedDB(){
  const vocabJson = localStorage.getItem('rc_gru_vocab');
  if (!vocabJson) throw new Error('No saved vocab in this browser.');
  const vocab = JSON.parse(vocabJson);
  const metaJson = localStorage.getItem('rc_gru_meta');
  const meta = metaJson ? JSON.parse(metaJson) : {};
  if (meta.seqLen && meta.seqLen !== SEQ_LEN)
    throw new Error('Saved model has different architecture.');

  idxToChar = vocab;
  vocabSize = vocab.length;
  charToIdx = new Map();
  idxToChar.forEach((ch, i) => charToIdx.set(ch, i));

  const m = await tf.loadLayersModel(IDB_KEY);
  return m;
}

/* =========================================================
   Generation
   ========================================================= */
function sampleFromProbs(probs, temp){
  const adj = Array.from(probs).map(p => Math.pow(Math.max(p, 1e-10), 1 / temp));
  const sum = adj.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < adj.length; i++){
    r -= adj[i];
    if (r <= 0) return i;
  }
  return adj.length - 1;
}

function cleanSeed(text){
  let clean = '';
  for (const ch of text){
    if (charToIdx.has(ch)) clean += ch;
  }
  return clean || ' ';
}

async function generateStream(seed, length, temp, onChar){
  const cleaned = cleanSeed(seed);
  let full = cleaned;
  while (full.length < SEQ_LEN) full = ' ' + full;

  for (let i = 0; i < length; i++){
    const window = full.slice(-SEQ_LEN);
    const indices = new Int32Array(SEQ_LEN);
    for (let j = 0; j < SEQ_LEN; j++){
      indices[j] = charToIdx.get(window[j]) ?? 0;
    }
    const xs = tf.tensor2d(indices, [1, SEQ_LEN], 'int32');
    const pred = model.predict(xs);
    const probs = await pred.data();
    xs.dispose();
    pred.dispose();

    const idx = sampleFromProbs(probs, temp);
    const ch = idxToChar[idx] ?? ' ';
    full += ch;
    if (onChar) onChar(ch);

    if (i % 8 === 0) await tf.nextFrame();
  }
}

/* =========================================================
   Chat send
   ========================================================= */
async function send(){
  const text = inputEl.value.trim();
  if (!text || busy || !ready) return;

  inputEl.value = '';
  autoGrow();
  busy = true;
  sendBtn.disabled = true;
  inputEl.disabled = true;

  addBubble('user', text);
  const bubble = addBubble('assistant', '');
  bubble.classList.add('streaming');

  try {
    await generateStream(text, 260, 0.85, ch => {
      bubble.textContent += ch;
      scrollDown();
    });
  } catch (err){
    bubble.textContent = '⚠️ Generation failed: ' + err.message;
  } finally {
    bubble.classList.remove('streaming');
    busy = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
    scrollDown();
  }
}

/* =========================================================
   Boot
   ========================================================= */
async function boot(){
  // Try docs/model.json first (works for anyone)
  try {
    setBanner('Loading <code>docs/model.json</code>…');
    const res = await fetch(MODEL_URL, { cache: 'no-store' });
    if (res.ok){
      const json = await res.json();
      model = await loadModelFromJSON(json);
      ready = true;
      setStatus('Trained model', 'ok');
      setBanner(
        '🦝 <b>Neural network loaded.</b> I was trained on the documents in this repo. ' +
        'I generate text in their style — I don\'t answer questions. Type anything and I\'ll continue it.',
        'ok'
      );
      enableChat();
      greet();
      return;
    }
  } catch (e){
    console.warn('docs/model.json not usable:', e.message);
  }

  // Fallback: try IndexedDB (works for the person who trained locally)
  try {
    setBanner('No model at <code>docs/model.json</code> — checking this browser…');
    model = await loadModelFromIndexedDB();
    ready = true;
    setStatus('Local model', 'ok');
    setBanner(
      '🦝 <b>Loaded a model saved in this browser.</b> It won\'t work for other visitors — ' +
      'to share it publicly, use <a href="train.html" style="color:#7ea5ff">train.html</a> → Download model.json → commit to <code>docs/model.json</code>.',
      'ok'
    );
    enableChat();
    greet();
    return;
  } catch (e){
    console.warn('IndexedDB model not usable:', e.message);
  }

  // No model at all
  setStatus('No model', 'bad');
  setBanner(
    '⚠️ <b>No trained model found.</b> Train one first: open ' +
    '<a href="train.html" style="color:#7ea5ff">train.html</a>, train the neural network, ' +
    'then download <code>model.json</code> and put it in <code>docs/</code>.',
    'bad'
  );
}

function enableChat(){
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function greet(){
  if (greetingShown) return;
  greetingShown = true;
  addBubble('assistant',
    "Hi! I'm Raccoon AI 🦝\n\n" +
    "I'm a small neural network trained on the documents in this repo. " +
    "I continue text in their style — I don't answer questions. " +
    "Type a phrase and I'll write more in that voice."
  );
}

/* =========================================================
   Events
   ========================================================= */
sendBtn.addEventListener('click', send);
inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

boot();
</script>
</body>
</html>
